# Production logging adjustments
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


management:
  endpoints:
    web:
      exposure:
        # Expose the metrics endpoint safely
        include: "health,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # Automatically adds an "application" tag to all your metrics
      application: "backend-service" 

spring:
  application:
    name: openbook
  datasource:
    url: ${SPRING_DATASOURCE_URL}?sslmode=disable
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver 

  jackson:
    default-property-inclusion: non_null
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # To avoid configuration on code-level, explicit redeclaration of connection parameters is done here in the configuration file
        connection.url: ${SPRING_DATASOURCE_URL}?sslmode=disable
        connection.username: ${SPRING_DATASOURCE_USERNAME}
        connection.password: ${SPRING_DATASOURCE_PASSWORD}
        
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: validate
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy


server:
  port: ${SPRING_SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /api-docs.html
    syntaxHighlight:
      theme: light

jwt:
  secret: ${JWT_SECRET:8284D6251655468576D5A713474371805096859703373367639792F423F45284}
  expiration: 86400000 # 24 hours in milliseconds

