logging:
    level:
        root: info

management:
  endpoints:
    web:
      exposure:
        # Expose the metrics endpoint safely
        include: "health,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # Automatically adds an "application" tag to all your metrics
      application: "backend-service" 

server:
  address: 0.0.0.0

spring:
    application:
        name: openbook
    datasource:
        url: ${SPRING_DATASOURCE_URL}?sslmode=disable
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver 
    jackson:
        default-property-inclusion: non_null
    jpa:
        properties:
            hibernate:
                ddl-auto: validate
                naming:
                    physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        show-sql: false
        database-platform: org.hibernate.dialect.PostgreSQLDialect

springdoc:
    swagger-ui:
        path: /api-docs.html
        syntaxHighlight:
            theme: light

jwt:
  secret: ${JWT_SECRET:8284D6251655468576D5A713474371805096859703373367639792F423F45284}
  expiration: 86400000 # 24 hours in milliseconds

# disable flyway execution
#spring.flyway.enabled=false

# If you have an existing database and start using Flyway for new database changes.
#spring.flyway.baseline-on-migrate=true

# To customize flyway migrations tracking table name
#spring.flyway.table=db_migrations

# In case of any flyway execution errors, clean up the database and re-run all the migrations
## NEVER USE THIS IN PRODUCTION. ONLY SUITABLE FOR PROTOTYPING
#spring.flyway.clean-disabled=false
#spring.flyway.clean-on-validation-error=true
