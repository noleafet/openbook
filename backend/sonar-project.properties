# =====================================================================
# 1. Project Identity
# =====================================================================
sonar.projectKey=openbook_backend

# =====================================================================
# 2. Code Locations (Maven/Gradle standard paths)
# =====================================================================
sonar.sources=src/main/java
sonar.tests=src/test/java

# Crucial for Java diagnostics: pointer to compiled binary classes
# For Gradle change to: build/classes/java/main
sonar.java.binaries=target/classes

# =====================================================================
# 3. Test & Coverage Tracking
# =====================================================================
# For Gradle change to: build/reports/jacoco/test/jacocoTestReport.xml
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# =====================================================================
# 4. Scope Exclusions
# =====================================================================
sonar.exclusions=**/target/**,**/build/**,**/*Application.java,**/config/**,**/dto/**

# =====================================================================
# 5. Language & Environment Specifics
# =====================================================================
# Encoding of the source files
sonar.sourceEncoding=UTF-8
