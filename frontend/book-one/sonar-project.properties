# =====================================================================
# 1. Project Identity
# =====================================================================
sonar.projectKey=openbook_frontend_book_one

# =====================================================================
# 2. File Locations & Scope
# =====================================================================
# Scan your app routing, custom components, hooks, utilities, and styles
sonar.sources=.

# Target only JavaScript, TypeScript, and JSX/TSX files for analysis
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# =====================================================================
# 3. Tests & Coverage Configuration
# =====================================================================
# Path to the LCOV file generated by Jest or Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# =====================================================================
# 4. Scope Exclusions
# =====================================================================
# Exclude dependencies, Next.js build directories, config files, and statics
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/dist/**,**/build/**,**/public/**,**/*.config.js,**/*.config.ts,next.env.d.ts,**/coverage/**

# =====================================================================
# 5. Language & Environment Specifics
# =====================================================================
# Points Sonar to your TypeScript setup so it can parse type configurations
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding of the source files
sonar.sourceEncoding=UTF-8
